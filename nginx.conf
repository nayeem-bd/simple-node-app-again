events {
    worker_connections 1024;
}

http {
    upstream node-app {
        server api:4000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://node-app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
