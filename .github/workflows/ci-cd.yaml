name: Feature CI/CD workflow

on:
  push:
    branches:
      - feature/*


env:
  DEPLOYMENT_SERVER_IP: ${{ secrets.INSTANCE_IP }}
  DEPLOYMENT_SERVER_KEY: ${{ secrets.INSTANCE_RSA_KEY }}

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

  test:
    name: Unit testing
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run linter
        run: npm run test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run coverage
        run: npm run coverage

  build-and-push:
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/simple-node-app:${{github.sha}} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-node-app:${{github.sha}}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Transfer docker compose to vm
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOYMENT_SERVER_IP }}
          username: ubuntu
          key: ${{ env.DEPLOYMENT_SERVER_KEY }}
          source: "docker-compose.production.yaml,nginx.conf"
          target: "~/"

      - name: Deploy nodeapp using docker compose
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ env.DEPLOYMENT_SERVER_IP }}
          username: ubuntu
          key: ${{ env.DEPLOYMENT_SERVER_KEY }}
          script: |
            export COMMIT_HASH=${{github.sha}}
            docker-compose -f docker-compose.production.yaml up -d
